<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fce3ec, #ffd6e0, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            border: 2px solid white;
            max-width: 400px;
            position: relative;
        }
        img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        h1 {
            color: #d6336c;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }
        #yesBtn:hover {
            background-color: #ff758f;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute;
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.pinimg.com/originals/68/8f/31/688f3193787114447bbbd5b850f2eb46.jpg" alt="Милый котик">
        
        <h1>Привет, котёнок 🐱</h1>
        <p>Я не айтишник, я в этом не разбираюсь, но постаралась создать для тебя открытку.<br><br>
        Скажи, пожалуйста, ты пойдёшь со мной на свидание?</p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="alert('Ура! Я знала, что ты согласишься! Люблю тебя ❤️')">Да</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            // Делаем кнопку фиксированной, чтобы она могла летать по всему экрану
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
    </script>

</body>
</html>
